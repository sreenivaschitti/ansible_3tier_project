---
- name: Install required packages
  ansible.builtin.dnf:
    name: nodejs
    state: present

- name: Create application user
  ansible.builtin.user:
    name: "{{ app_user }}"
    shell: /bin/bash
    create_home: true
    state: present

- name: Create application directory
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: '0755'


- name: Deploy application source
  ansible.builtin.git:
    repo: "{{ app_repo }}"
    dest: "{{ app_dir }}"
    version: "{{ app_branch }}"
    force: true
  become_user: "{{ app_user }}"


- name: Configure application environment
  ansible.builtin.template:
    src: app.env.j2
    dest: "{{ app_dir }}/.env"
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: '0600'


- name: Check Node.js version
  ansible.builtin.command:
    cmd: node --version
  register: node_version
  changed_when: false

- name: Display Node.js version
  ansible.builtin.debug:
    msg: "Node.js version: {{ node_version.stdout }}"

- name: Install application systemd service
  ansible.builtin.template:
    src: employee-app.service.j2
    dest: /etc/systemd/system/employee-app.service
    owner: root
    group: root
    mode: '0644'
  notify: Restart employee application

- name: Enable and start application
  ansible.builtin.systemd:
    name: employee-app
    enabled: true
    state: started
    daemon_reload: true    