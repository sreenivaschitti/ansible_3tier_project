---
- name: Install required packages
  ansible.builtin.dnf:
    name:
      - wget
      - curl
      - vim
    state: present

- name: Add MongoDB repository
  ansible.builtin.copy:
    dest: /etc/yum.repos.d/mongodb-org-8.0.repo
    owner: root
    group: root
    mode: '0644'
    content: |
      [mongodb-org-8.0]
      name=MongoDB Repository
      baseurl=https://repo.mongodb.org/yum/amazon/2023/mongodb-org/8.0/x86_64/
      gpgcheck=1
      enabled=1
      gpgkey=https://pgp.mongodb.com/server-8.0.asc

- name: Install MongoDB
  ansible.builtin.dnf:
    name: mongodb-org
    state: present

- name: Configure MongoDB
  ansible.builtin.template:
    src: mongod.conf.j2
    dest: /etc/mongod.conf
    owner: root
    group: root
    mode: '0644'
  notify: Restart MongoDB    

- name: Ensure MongoDB is enabled and started
  ansible.builtin.systemd:
    name: mongod
    enabled: true
    state: started

- name: Check MongoDB service
  ansible.builtin.command:
    cmd: systemctl is-active mongod
  register: mongodb_status
  changed_when: false

- name: Display MongoDB status
  ansible.builtin.debug:
    msg: "MongoDB status: {{ mongodb_status.stdout }}"