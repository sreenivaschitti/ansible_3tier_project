---
plugin: amazon.aws.aws_ec2

regions:
  - us-east-1

filters:
  instance-state-name: running

hostnames:
  - ip-address

compose:
  ansible_host: private_ip_address

keyed_groups:
  - key: tags.Tier
    prefix: ""
    separator: ""

compose:
  ansible_user: ec2-user
  ansible_ssh_private_key_file: /home/ec2-user/my-key.pem